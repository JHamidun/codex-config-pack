name: Validate portable pack
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate the shipped bundle
        run: python -B scripts/validate_pack.py
      - name: Install build-test dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test additive installation and safe uninstall
        run: python -B -m unittest discover -s tests -v
      - name: Exercise discovery
        run: python -B bundle/scripts/catalog.py "api documentation" --limit 3
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned scanner and verify checksum
        run: |
          curl --fail --location --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan release tree without exposing matched values
        run: '"$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --redact=100 --no-banner'
