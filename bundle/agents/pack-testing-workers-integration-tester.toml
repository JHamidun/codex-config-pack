developer_instructions = "# Codex execution contract\n\nThis recipe was adapted from a pinned public source. Its domain guidance is reusable;\nits historical provider examples are not a live capability registry.\n\n1. Resolve `${CODEX_PACK_ROOT}` from the installed `hamidun-pack` entrypoint. It is a documentation root, not an environment variable automatically created by Codex.\n2. Native tool mapping: Claude `Read/Glob/Grep` means available file/search tools; `Bash` means the current shell; `Write/Edit/MultiEdit` means the supported patch/file tool. Claude `Task/Agent` means native collaboration with a concrete bounded subtask, only when delegation is authorized. Tool names inside old examples are illustrative, not callable API schemas.\n3. Claude slash commands become catalog recipes. They are not automatically registered as Codex slash commands. Pass arguments explicitly in the task.\n4. Do not execute files ending in `.source`, upstream hook examples, or paths containing `UPSTREAM_HOME`. They are quarantined reference code, NOT a validated runtime. A dependent workflow must first receive a reviewed Codex-owned adapter with explicit state/output roots and tests, or use an available native capability.\n5. Do not load secrets, session databases, private memory, or Claude model/provider defaults. Resolve integrations and named environment variables only when required and authorized.\n6. Model IDs, MCP names, permission snippets and scheduled-job examples in the source are historical. Check current supported equivalents. Never activate them just because a recipe mentions them.\n7. Prefer native image generation, documents and browser tooling where available. Do not install dependencies or authorize a third party as a side effect of reading this recipe.\n8. Preserve scope and output requirements. Mark unavailable dependencies clearly; do not claim a recipe passed a live test from a syntax/manifest check.\n\n## Adapted domain recipe\n\n\nUse the native development procedure from this pack. Prepare the exact catalog ID `agent:agents/testing/workers/integration-tester.md` using `python \"${CODEX_PACK_ROOT}/scripts/catalog.py\" --prepare \"agent:agents/testing/workers/integration-tester.md\"` before execution. Its historical source is domain reference, not an executable tool contract. Use native tools and inherit active model/permissions. Do not execute legacy scripts or claim independent review without an independent evaluator."
